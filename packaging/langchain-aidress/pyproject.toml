[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-aidress"
version = "0.2.0"
description = "Aidress agent trust and discovery tools for LangChain"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Aidress" }]
keywords = ["langchain", "aidress", "agents", "trust", "registry", "discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langchain-core>=0.3,<2",
    # 0.3.0 is the floor: rotate()/claim()/update() and match()'s org_name +
    # message_protocol filters, all surfaced as tools here, do not exist before it.
    "aidress-sdk>=0.3.0,<1.0.0",
]

[project.urls]
Homepage = "https://aidress.ai"
Repository = "https://github.com/Aidress-ai/Aidress"
"Bug Tracker" = "https://github.com/Aidress-ai/Aidress/issues"

[dependency-groups]
test = [
    "pytest>=7,<9",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "langchain-tests>=0.3",
    "respx>=0.21",
]
lint = ["ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_aidress"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
